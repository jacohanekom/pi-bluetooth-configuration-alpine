name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    # Genuinely aarch64 hardware (no QEMU) -- matches the actual deploy
    # target and keeps the container build a native compile rather than
    # an emulated cross-build. Note this only proves the code compiles and
    # links -- there's no real Pico attached to this runner, so
    # pico_transport.hpp's actual USB-serial link can only be exercised
    # on an actual Pi with the Pico plugged in.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      # openssl-dev is a normal Alpine package -- there's nothing to
      # fetch and build from source here. No dbus-dev: the BLE peripheral
      # role lives on a Pico's own BTstack build now (see
      # src/pico_transport.hpp), not this daemon talking to BlueZ.
      - name: Build in Alpine container
        run: |
          docker run --rm -v "$PWD":/work -w /work alpine:3.20 sh -c '
            set -e
            apk add --no-cache build-base openssl-dev pkgconf

            make

            mkdir -p dist
            cp pi-bluetooth-configuration dist/
            cp config.ini dist/
            cp openrc/pi-bluetooth-configuration.initd dist/
          '

      - name: Package artifact
        run: |
          mkdir -p pi-bluetooth-configuration-alpine-aarch64
          cp dist/* pi-bluetooth-configuration-alpine-aarch64/
          tar czf pi-bluetooth-configuration-alpine-aarch64.tar.gz pi-bluetooth-configuration-alpine-aarch64

      - uses: actions/upload-artifact@v4
        with:
          name: pi-bluetooth-configuration-alpine-aarch64
          path: pi-bluetooth-configuration-alpine-aarch64.tar.gz

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: pi-bluetooth-configuration-alpine-aarch64.tar.gz

  apk:
    # Builds an actual installable .apk (via abuild, alpine/APKBUILD) so
    # it can go straight on a device with `apk add --allow-untrusted
    # pi-bluetooth-configuration-*.apk`, no repo/network needed at install
    # time. The signing key generated below is throwaway/per-run -- it
    # exists only so abuild has something to sign with, not to establish
    # trust for a distributed repo, hence --allow-untrusted on install.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Build .apk in Alpine container
        run: |
          mkdir -p apk-dist apk-home
          docker run --rm -v "$PWD":/work -w /work/alpine \
            -e HOME=/work/apk-home -e REPODEST=/work/apk-dist \
            alpine:3.20 sh -c '
              set -e
              # abuild-keygen -i (installs the pubkey to /etc/apk/keys) and
              # abuild'\''s makedepends install both shell out to doas
              # directly -- alpine-sdk'\''s abuild-sudo group trick alone
              # does not cover this. doas.conf must be at /etc/doas.conf
              # (not /etc/doas.d/) and use "nopass" (doas syntax, not
              # sudo'\''s "nopasswd").
              #
              # `apk update` (not `add --no-cache`) so a persistent index
              # cache exists in /var/cache/apk -- abuild'\''s own internal
              # `apk add` for makedepends has no index otherwise and
              # reports every package as nonexistent.
              apk update
              apk add alpine-sdk doas
              echo "permit nopass builder" > /etc/doas.conf
              chmod 0400 /etc/doas.conf

              adduser -D builder
              addgroup builder abuild
              mkdir -p "$HOME"
              # Only these need to be builder-writable (abuild populates
              # alpine/src and alpine/pkg, HOME holds the signing key,
              # REPODEST holds the built .apk) -- chowning all of /work
              # would leave the bind-mounted checkout owned by builder'\''s
              # uid on the host after the container exits, breaking the
              # runner'\''s own later steps with Permission denied.
              chown -R builder:builder /work/alpine "$HOME" "$REPODEST"

              su builder -c "
                set -e
                abuild-keygen -a -i -n
                cd /work/alpine
                abuild checksum
                abuild -r
              "
            '

      - name: Collect .apk artifact
        run: |
          APK_PATH="$(find apk-dist -name '*.apk' | head -n1)"
          test -n "$APK_PATH"
          cp "$APK_PATH" pi-bluetooth-configuration-aarch64.apk

      - uses: actions/upload-artifact@v4
        with:
          name: pi-bluetooth-configuration-apk-aarch64
          path: pi-bluetooth-configuration-aarch64.apk

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: pi-bluetooth-configuration-aarch64.apk
