name: Build SD card image (Pi Zero / armhf)

# Manual only -- same reasoning as sdcard-image-pi3.yml: depends on the
# other two repos' latest artifacts too, and produces a large image
# that shouldn't pile up in Actions storage on every push. Run it from
# this repo's Actions tab, or `gh workflow run
# sdcard-image-pi-zero.yml -R jacohanekom/pi-bluetooth-configuration-alpine`.
on:
  workflow_dispatch:
    inputs:
      hostname:
        description: "Hostname to bake into the image"
        required: false
        default: "aipicam"

jobs:
  build-image:
    # Unlike sdcard-image-pi3.yml's genuinely-native ubuntu-24.04-arm
    # runner, there's no GitHub-hosted ARMv6 runner at all -- every
    # `docker run --platform linux/arm/v6` in build-image.sh runs
    # emulated here, same as this project's own armhf build.yml jobs.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm

      - name: Fetch this repo's latest armhf .apk
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p sdcard-image-pi-zero/artifacts
          RUN_ID="$(gh run list -R "${{ github.repository }}" --workflow=build.yml --status=success -L 1 --json databaseId -q '.[0].databaseId')"
          test -n "$RUN_ID"
          gh run download "$RUN_ID" -R "${{ github.repository }}" \
            -n pi-bluetooth-configuration-apk-armhf -D sdcard-image-pi-zero/artifacts

      # Cross-repo artifact downloads need secrets.CROSS_REPO_GH_TOKEN --
      # same PAT already set up for sdcard-image-pi3.yml, shared here.
      - name: Fetch pi-relay-control-alpine's latest armhf .apk
        env:
          GH_TOKEN: ${{ secrets.CROSS_REPO_GH_TOKEN }}
        run: |
          RUN_ID="$(gh run list -R jacohanekom/pi-relay-control-alpine --workflow=build.yml --status=success -L 1 --json databaseId -q '.[0].databaseId')"
          test -n "$RUN_ID"
          gh run download "$RUN_ID" -R jacohanekom/pi-relay-control-alpine \
            -n pi-relay-control-apk-armhf -D sdcard-image-pi-zero/artifacts

      - name: Fetch victron-ve-direct-alpine's latest armhf .apk
        env:
          GH_TOKEN: ${{ secrets.CROSS_REPO_GH_TOKEN }}
        run: |
          RUN_ID="$(gh run list -R jacohanekom/victron-ve-direct-alpine --workflow=build.yml --status=success -L 1 --json databaseId -q '.[0].databaseId')"
          test -n "$RUN_ID"
          gh run download "$RUN_ID" -R jacohanekom/victron-ve-direct-alpine \
            -n victron-ve-direct-apk-armhf -D sdcard-image-pi-zero/artifacts

      - name: Build the SD card image
        env:
          ROOT_PASSWORD: ${{ secrets.SDCARD_ROOT_PASSWORD }}
          PI_HOSTNAME: ${{ inputs.hostname }}
        run: |
          cd sdcard-image-pi-zero
          ./build-image.sh

      # Short retention -- this is a ~768MB build artifact, not source.
      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: aipicam-pi-zero-diskless
          path: sdcard-image-pi-zero/aipicam-pi-zero-diskless.img
          retention-days: 14
