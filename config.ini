; ╔══════════════════════════════════════════════════════════╗
; ║  pi-bluetooth-configuration -- configuration file        ║
; ╚══════════════════════════════════════════════════════════╝

[bluetooth]
adapter          = hci0                       ; local adapter, e.g. hci0
device_name      = pi-bluetooth-configuration ; advertised LE local name
; No pairing/bonding -- characteristics are plain read/write, not
; encrypted. WiFi credentials cross BLE in the clear. See the README's
; Security model section before using this on anything but a trusted
; home/lab network.

[wifi]
interface        = wlan0

[ethernet]
; Direct-connect gateway -- eth0 always gets this static IP + a DHCP
; server on first boot (if no static config is persisted yet), so the
; Pi is reachable over Ethernet with no app interaction needed. Once
; WiFi is configured, this becomes read-only -- see the
; "set_ethernet"/"clear_ethernet" commands and the README's "Ethernet
; direct-connect" section. Applied immediately, no reboot needed.
interface        = eth0
ip               = 192.168.4.1

[scan]
max_results      = 10                          ; strongest N networks returned per scan
