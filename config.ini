; ╔══════════════════════════════════════════════════════════╗
; ║  pi-bluetooth-configuration -- configuration file        ║
; ╚══════════════════════════════════════════════════════════╝

[http]
; Plain, unauthenticated HTTP -- serves both the browser-based web UI
; (GET /) and its JSON API, reachable over eth0/eth1 (see [ethernet]
; below) at all times, and over WiFi too once a network is joined. No
; TLS: see the README's Security model section before using this on
; anything but a trusted home/lab network.
port             = 8080

[wifi]
interface        = wlan0
; Used only for this daemon's own log lines and as a fallback device
; label if the Pi's hardware serial can't be read (e.g. not running on
; real Pi hardware) -- normally the serial is used instead (as the
; system hostname and mDNS service name), so multiple aipicam units are
; distinguishable from each other.
device_name      = pi-bluetooth-configuration
; How long to wait, on startup, for wpa_supplicant to join whatever
; network is already configured before giving up. Covers both "wrong
; password/out of range" and "nothing configured yet" the same way --
; either one just fails to reach this within the timeout. wlan0 stays in
; station mode either way; use the web UI over Ethernet to join a
; network if this times out.
connect_timeout_secs = 20

[ethernet]
; Direct-connect gateway -- eth0 gets this static IP + DHCP range
; (assigned directly, independent of dhcpcd/carrier state), reapplied
; on every boot, so the Pi is reachable over Ethernet with no app
; interaction needed. These values are only the defaults used until
; different ones are chosen (during the setup wizard's local network
; configuration step); once chosen, those values persist instead. Once
; setup finishes, this becomes read-only -- see the "set_ethernet"/
; "finish" commands and the README's "Ethernet direct-connect" section.
; Applied immediately, no reboot needed.
interface        = eth0
; Optional -- a second wired interface (e.g. a USB-Ethernet dongle,
; commonly eth1) to bridge together with `interface` above onto the
; same local network, rather than each getting its own address. Leave
; blank (or omit) if there's only one wired port. Safe to set even if
; this particular Pi doesn't actually have it -- see the README's
; "Ethernet direct-connect" section for why a bridge is used here at
; all rather than just assigning both interfaces addresses directly.
interface2       =
ip               = 192.168.4.1
dhcp_range_start = 2
dhcp_range_end   = 200

[scan]
max_results      = 10                          ; strongest N networks returned per scan

[relays]
; Optional: relays this daemon can trigger over its HTTP API by
; forwarding "on"/"off" to pi-relay-control-alpine's per-relay TCP
; socket on 127.0.0.1. One line per relay: "relay <port> <label>".
; <port> must match the port assigned to that same relay in
; pi-relay-control-alpine's own /etc/pi-relay-control.conf -- this file
; only needs the port and a display label, not the GPIO pin. Leave this
; section empty (or omit it) if pi-relay-control-alpine isn't installed.
;
; enabled = false turns relay control off entirely -- POST /relay is
; rejected and GET /status's "relays" reports each relay as "disabled" --
; without needing to delete/comment out the "relay" lines below one by
; one. Toggle it back on any time from the web UI's "Relay control"
; switch, or by flipping this line back to true and restarting.
; Defaults to true (relay control is on) if this line is omitted
; entirely -- ships false here since a fresh install has no way to know
; whether real relay hardware is actually attached yet.
enabled = false
relay 7778 Camera
relay 7779 Sound Amplifier

[victron]
; Optional: solar/battery telemetry this daemon reads over BLE by
; querying victron-ve-direct-alpine's status control port on 127.0.0.1
; (the same port its own README's "echo status | nc 127.0.0.1 <port>"
; uses). Harmless to leave at the default if victron-ve-direct-alpine
; isn't installed -- queries just fail to connect and the Victron
; characteristic reports {"connected":false}.
ctrl_port  = 8562
