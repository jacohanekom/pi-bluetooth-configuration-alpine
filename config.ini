; ╔══════════════════════════════════════════════════════════╗
; ║  pi-bluetooth-configuration -- configuration file        ║
; ╚══════════════════════════════════════════════════════════╝

[bluetooth]
adapter          = hci0                       ; local adapter, e.g. hci0
device_name      = pi-bluetooth-configuration ; advertised LE local name
; Pairing agent I/O capability. NoInputNoOutput is the only sane choice for
; a headless Pi with no display/keyboard -- pairing is "Just Works"
; (encrypted, but not protected against an active attacker during the
; initial pairing handshake). See the README before changing this.
agent_capability = NoInputNoOutput

[wifi]
interface        = wlan0

[scan]
max_results      = 10                          ; strongest N networks returned per scan

[network]
; Plain JSON-over-TCP control interface, always listening -- a client
; should hand off to this once Status (over BLE) reports a non-empty ip,
; since the Pi 3's onboard Bluetooth shares an antenna with its WiFi
; radio and BLE routinely drops once WiFi is actively passing traffic.
; UNAUTHENTICATED: anyone who can reach this port on the LAN can read
; status or reconfigure WiFi credentials. See the README.
port             = 8567
