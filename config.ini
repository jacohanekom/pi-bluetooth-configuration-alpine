; ╔══════════════════════════════════════════════════════════╗
; ║  pi-bluetooth-configuration -- configuration file        ║
; ╚══════════════════════════════════════════════════════════╝

[http]
; Plain, unauthenticated HTTP -- reachable both from a phone joined to
; this Pi's own fallback AP (see [ap] below) and, once WiFi is
; configured, from the real network it joined. No TLS: see the README's
; Security model section before using this on anything but a trusted
; home/lab network.
port             = 8080

[wifi]
interface        = wlan0
; Used both for this daemon's own log lines and as the fallback AP's
; SSID if the Pi's hardware serial can't be read (e.g. not running on
; real Pi hardware) -- normally the serial is used instead, so multiple
; aipicam units are distinguishable in a phone's WiFi network list. See
; ap_control.hpp.
device_name      = pi-bluetooth-configuration
; How long to wait, on startup, for wpa_supplicant to join whatever
; network is already configured before giving up and starting the
; fallback AP instead. Covers both "wrong password/out of range" and
; "nothing configured yet" the same way -- either one just fails to
; reach this within the timeout.
connect_timeout_secs = 20

[ap]
; The fallback access point a phone joins directly when this Pi can't
; join a real WiFi network on its own (nothing configured yet, or the
; configured network is unreachable/wrong password) -- see
; ap_control.hpp. Deliberately open (no password); the SSID is this
; Pi's own hardware serial, not configured here (see [wifi]'s
; device_name for the fallback if that can't be read).
;
; Distinct subnet from [ethernet] below so the two can never collide if
; a client happens to be on both eth0 and the AP at once.
ip               = 192.168.5.1
dhcp_range_start = 2
dhcp_range_end   = 200

[ethernet]
; Direct-connect gateway -- eth0 gets this static IP + DHCP range
; (assigned directly, independent of dhcpcd/carrier state), reapplied
; on every boot, so the Pi is reachable over Ethernet with no app
; interaction needed. These values are only the defaults used until
; different ones are chosen (during the setup wizard's local network
; configuration step); once chosen, those values persist instead. Once
; setup finishes, this becomes read-only -- see the "set_ethernet"/
; "finish" commands and the README's "Ethernet direct-connect" section.
; Applied immediately, no reboot needed.
interface        = eth0
ip               = 192.168.4.1
dhcp_range_start = 2
dhcp_range_end   = 200

[scan]
max_results      = 10                          ; strongest N networks returned per scan

[relays]
; Optional: relays this daemon can trigger over BLE by forwarding
; "relay <port> on|off" to pi-relay-control-alpine's per-relay TCP
; socket on 127.0.0.1. One line per relay: "relay <port> <label>".
; <port> must match the port assigned to that same relay in
; pi-relay-control-alpine's own /etc/pi-relay-control.conf -- this file
; only needs the port and a display label, not the GPIO pin. Leave this
; section empty (or omit it) if pi-relay-control-alpine isn't installed.
relay 7778 Camera
relay 7779 Sound Amplifier

[victron]
; Optional: solar/battery telemetry this daemon reads over BLE by
; querying victron-ve-direct-alpine's status control port on 127.0.0.1
; (the same port its own README's "echo status | nc 127.0.0.1 <port>"
; uses). Harmless to leave at the default if victron-ve-direct-alpine
; isn't installed -- queries just fail to connect and the Victron
; characteristic reports {"connected":false}.
ctrl_port  = 8562
