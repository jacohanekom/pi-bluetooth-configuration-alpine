# Default wpa_supplicant.conf, shipped so a control interface exists
# from the very first boot -- before this, on a genuinely fresh device
# with nothing ever configured, wpa_supplicant's own OpenRC init script
# only passes -c <path> when /etc/wpa_supplicant/wpa_supplicant.conf
# already exists (see its start_pre()); with no config file at all it
# falls back to -u (D-Bus) mode with no ctrl_interface configured,
# meaning wpa_cli can never talk to it. That silently broke both the
# pre-connect status poll and the pre-AP-mode network scan (both just
# treat "wpa_cli can't connect" the same as "not connected yet"/"no
# results" -- see wifi_control.hpp's refresh_status()/scan()), so a
# never-before-configured device could never show the user any nearby
# networks to choose from. Found by an actual first-boot hardware test.
#
# update_config=1 is required for wpa_cli's own save_config (called by
# WifiControl::connect()) to persist the network it just joined back
# into this file -- without it, save_config returns FAIL and the
# connection wouldn't survive a reboot.
ctrl_interface=DIR=/var/run/wpa_supplicant GROUP=0
update_config=1
